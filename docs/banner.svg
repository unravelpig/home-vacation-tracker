  <!-- footer chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="18">
    <rect x="64" y="576" width="132" height="36" rx="18" fill="#2C3E50"/>
    <text x="130" y="600" fill="#FDFBF7" text-anchor="middle">SQLite</text>
    <rect x="212" y="576" width="140" height="36" rx="18" fill="#2C3E50"/>
    <text x="282" y="600" fill="#FDFBF7" text-anchor="middle">Next.js</text>
    <rect x="368" y="576" width="146" height="36" rx="18" fill="#2C3E50"/>
    <text x="441" y="600" fill="#FDFBF7" text-anchor="middle">Docker</text>
    <rect x="530" y="576" width="164" height="36" rx="18" fill="#E67E22"/>
    <text x="612" y="600" fill="#FFFFFF" text-anchor="middle">Self-hosted</text>
