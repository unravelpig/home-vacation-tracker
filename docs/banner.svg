<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Georgia, serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect x="0" y="0" width="1280" height="88" fill="#2C3E50"/>
  <circle cx="64" cy="44" r="14" fill="#E67E22"/>
  <path d="M58 44 l4 4 l8 -9" stroke="#FDFBF7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="53" fill="#FDFBF7" font-size="30">Home Vacation Tracker</text>
  <text x="1216" y="51" fill="#E0D6C8" font-size="19" text-anchor="end" font-family="Inter, system-ui, sans-serif">idea → plan → trip</text>

  <!-- year strip -->
  <g transform="translate(64,132)">
    <text x="0" y="0" fill="#2C3E50" font-size="44" dominant-baseline="hanging">The whole year,</text>
    <text x="0" y="58" fill="#E67E22" font-size="44" dominant-baseline="hanging">one screen.</text>
    <text x="0" y="132" fill="#7F8C8D" font-size="21" font-family="Inter, system-ui, sans-serif" dominant-baseline="hanging">
      Brainstorm travel ideas, turn them into plans,
    </text>
    <text x="0" y="164" fill="#7F8C8D" font-size="21" font-family="Inter, system-ui, sans-serif" dominant-baseline="hanging">
      and watch the year fill up with trips.
    </text>

    <!-- legend -->
    <g transform="translate(0,226)" font-family="Inter, system-ui, sans-serif" font-size="19">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#3498DB"/>
      <text x="28" y="15" fill="#2C3E50">Idea</text>
      <rect x="108" y="0" width="18" height="18" rx="4" fill="#27AE60"/>
      <text x="136" y="15" fill="#2C3E50">Planned</text>
      <rect x="252" y="0" width="18" height="18" rx="4" fill="#9B59B6"/>
      <text x="280" y="15" fill="#2C3E50">Completed</text>
      <rect x="432" y="0" width="18" height="18" rx="4" fill="#E67E22"/>
      <text x="460" y="15" fill="#2C3E50">Time off</text>
    </g>
  </g>

  <!-- mini calendar card -->
  <g transform="translate(746,132)">
    <rect x="0" y="0" width="470" height="300" rx="16" fill="#FFFFFF" stroke="#E0D6C8" stroke-width="2"/>
    <text x="28" y="42" fill="#2C3E50" font-size="26">2026</text>
    <circle cx="420" cy="34" r="6" fill="#E0D6C8"/>
    <circle cx="444" cy="34" r="6" fill="#E67E22"/>
    <g fill="#F5F0E8">
      <rect x="28" y="70" width="48" height="34" rx="6"/><rect x="88" y="70" width="48" height="34" rx="6"/>
      <rect x="148" y="70" width="48" height="34" rx="6"/><rect x="208" y="70" width="48" height="34" rx="6"/>
      <rect x="268" y="70" width="48" height="34" rx="6"/><rect x="328" y="70" width="48" height="34" rx="6"/>
      <rect x="388" y="70" width="48" height="34" rx="6"/>
      <rect x="28" y="116" width="48" height="34" rx="6"/><rect x="88" y="116" width="48" height="34" rx="6"/>
      <rect x="148" y="116" width="48" height="34" rx="6"/><rect x="268" y="116" width="48" height="34" rx="6"/>
      <rect x="328" y="116" width="48" height="34" rx="6"/><rect x="388" y="116" width="48" height="34" rx="6"/>
      <rect x="28" y="162" width="48" height="34" rx="6"/><rect x="88" y="162" width="48" height="34" rx="6"/>
      <rect x="208" y="162" width="48" height="34" rx="6"/><rect x="268" y="162" width="48" height="34" rx="6"/>
      <rect x="328" y="162" width="48" height="34" rx="6"/><rect x="388" y="162" width="48" height="34" rx="6"/>
      <rect x="28" y="208" width="48" height="34" rx="6"/><rect x="148" y="208" width="48" height="34" rx="6"/>
      <rect x="208" y="208" width="48" height="34" rx="6"/><rect x="268" y="208" width="48" height="34" rx="6"/>
      <rect x="328" y="208" width="48" height="34" rx="6"/><rect x="388" y="208" width="48" height="34" rx="6"/>
    </g>
    <rect x="148" y="70" width="48" height="34" rx="6" fill="#3498DB"/>
    <rect x="208" y="70" width="48" height="34" rx="6" fill="#27AE60"/>
    <rect x="208" y="116" width="48" height="34" rx="6" fill="#27AE60"/>
    <rect x="88" y="162" width="48" height="34" rx="6" fill="#E67E22"/>
    <rect x="148" y="162" width="48" height="34" rx="6" fill="#9B59B6"/>
    <rect x="88" y="208" width="48" height="34" rx="6" fill="#E67E22"/>
  </g>

  <!-- dotted route between calendar and map -->
  <path d="M690 470 C 560 520, 420 500, 300 530" stroke="#E67E22" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
  <circle cx="300" cy="530" r="7" fill="#E67E22"/>
  <path d="M294 530 l5 5 l10 -11" stroke="#FDFBF7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

