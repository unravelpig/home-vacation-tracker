    <circle cx="152" cy="492" r="5"/><circle cx="184" cy="512" r="5"/><circle cx="216" cy="492" r="5"/>
    <circle cx="248" cy="470" r="5"/><circle cx="280" cy="452" r="5"/><circle cx="312" cy="470" r="5"/>
    <circle cx="344" cy="452" r="5"/><circle cx="376" cy="470" r="5"/><circle cx="408" cy="452" r="5"/>
    <circle cx="440" cy="470" r="5"/><circle cx="472" cy="492" r="5"/><circle cx="504" cy="470" r="5"/>
    <circle cx="536" cy="452" r="5"/><circle cx="568" cy="470" r="5"/><circle cx="600" cy="492" r="5"/>
    <circle cx="632" cy="470" r="5"/><circle cx="664" cy="452" r="5"/><circle cx="96"  cy="492" r="5"/>
    <circle cx="696" cy="470" r="5"/><circle cx="728" cy="452" r="5"/><circle cx="760" cy="470" r="5"/>
    <circle cx="792" cy="452" r="5"/><circle cx="824" cy="470" r="5"/><circle cx="856" cy="492" r="5"/>
    <circle cx="888" cy="470" r="5"/><circle cx="920" cy="452" r="5"/><circle cx="952" cy="470" r="5"/>
    <circle cx="984" cy="452" r="5"/><circle cx="1016" cy="470" r="5"/><circle cx="1048" cy="452" r="5"/>
    <circle cx="1080" cy="470" r="5"/><circle cx="1112" cy="452" r="5"/><circle cx="1144" cy="470" r="5"/>
    <circle cx="1176" cy="452" r="5"/><circle cx="216" cy="532" r="5"/><circle cx="248" cy="552" r="5"/>
    <circle cx="280" cy="572" r="5"/><circle cx="120" cy="530" r="5"/><circle cx="560" cy="530" r="5"/>
